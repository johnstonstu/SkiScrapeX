<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkiScrapex · Sound lab</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0d1822; color: #eef4f8; font: 15px/1.45 system-ui, sans-serif; }
      main { max-width: 46rem; margin: 0 auto; padding: 1rem; display: grid; gap: 1rem; }
      h1 { font-size: 1.3rem; margin: 0; }
      h2 { font-size: 1rem; margin: 0 0 0.2rem; }
      p { margin: 0; color: #b8c7d3; }
      section { background: #15232f; border: 1px solid #ffffff1a; border-radius: 12px; padding: 0.8rem 1rem; display: grid; gap: 0.5rem; }
      button, select { font: inherit; color: inherit; background: #1d2b38; border: 1px solid #ffffff2a; border-radius: 8px; padding: 0.45rem 0.8rem; cursor: pointer; }
      button.on { background: #ff7a45; color: #111; border-color: transparent; }
      .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
      label { display: grid; grid-template-columns: 7rem 1fr 3.5rem; gap: 0.6rem; align-items: center; }
      input[type="range"] { width: 100%; }
      output { font-variant-numeric: tabular-nums; text-align: right; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Sound lab</h1>
        <p>Every game sound is made in the browser. Play a scripted moment, or drive the snow and wind by hand. Headphones show the most.</p>
      </header>
      <section id="hand">
        <h2>By hand</h2>
        <div class="row">
          <button id="hand-play" type="button">Play</button>
          <select id="hand-surface" aria-label="Snow"></select>
          <button id="hand-air" type="button">In the air</button>
          <button id="hand-tuck" type="button">Tuck</button>
        </div>
        <label>Speed <input id="hand-speed" type="range" min="0" max="120" value="55" /><output></output></label>
        <label>Edge angle <input id="hand-edge" type="range" min="-60" max="60" value="35" /><output></output></label>
        <label>Skid <input id="hand-skid" type="range" min="0" max="100" value="5" /><output></output></label>
        <label>Chatter <input id="hand-chatter" type="range" min="0" max="100" value="0" /><output></output></label>
        <label>Powder sink <input id="hand-sink" type="range" min="0" max="40" value="0" /><output></output></label>
      </section>
      <div id="scenarios" style="display: grid; gap: 1rem"></div>
    </main>
    <script type="module" src="/src/tools/soundLab.ts"></script>
  </body>
</html>
