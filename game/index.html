<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#132637" />
    <title>SkiScrapex · Apex Mountain</title>
  </head>
  <body>
    <canvas id="view" tabindex="-1"></canvas>
    <header id="hud">
      <p id="run-name">SkiScrapex</p>
      <div class="readouts">
        <div><span id="speed">0</span><small>km/h</small></div>
        <div><span id="time">0:00.0</span><small>time</small></div>
        <div><span id="best">–</span><small>best</small></div>
      </div>
      <div class="slopes" id="slopes" hidden></div>
      <small class="hud-version" id="hud-version"></small>
    </header>
    <div id="buttons">
      <button type="button" id="btn-menu" aria-controls="pause-menu" aria-expanded="false">Pause</button>
    </div>
    <section id="pause-menu" hidden role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="pause-card">
        <header class="pause-heading">
          <div><h2 id="pause-title">Paused</h2><p id="pause-location"></p></div>
          <span class="version" id="version"></span>
        </header>
        <div class="pause-body">
          <nav class="pause-actions" aria-label="Pause actions">
            <button type="button" id="btn-resume">Resume skiing <kbd>Esc</kbd></button>
            <button type="button" id="btn-runs">Runs &amp; parks <kbd>T</kbd></button>
            <button type="button" id="btn-challenges">Challenges <kbd>H</kbd></button>
            <button type="button" id="btn-style">Rider &amp; gear <kbd>O</kbd></button>
            <button type="button" id="btn-settings">Settings <kbd>G</kbd></button>
            <button type="button" id="btn-reset">Restart run <kbd>R</kbd></button>
            <div class="pause-toggles">
              <button type="button" id="btn-camera"><span id="camera-label">Camera · Follow</span> <kbd>C</kbd></button>
              <button type="button" id="btn-map" aria-pressed="true">Resort map <kbd>M</kbd></button>
              <button type="button" id="btn-sound" aria-pressed="true">Sound · On</button>
              <button type="button" id="btn-info" aria-pressed="false">Performance info <kbd>I</kbd></button>
            </div>
            <button type="button" id="btn-title" class="pause-exit">Main menu</button>
          </nav>
          <section class="pause-guide" aria-labelledby="guide-title">
            <header class="guide-heading">
              <h3 id="guide-title">Controls</h3>
              <div id="control-tabs" role="group" aria-label="Input type">
                <button type="button" data-guide="keys" aria-pressed="true" aria-controls="control-guide">Keyboard</button>
                <button type="button" data-guide="pad" aria-pressed="false" aria-controls="control-guide">Controller</button>
                <button type="button" data-guide="touch" aria-pressed="false" aria-controls="control-guide">Touch</button>
              </div>
            </header>
            <div id="control-guide"></div>
          </section>
        </div>
      </div>
    </section>
    <pre id="debug" hidden></pre>
    <figure id="map-panel" hidden><canvas id="minimap" aria-label="Resort map"></canvas><figcaption id="map-location"></figcaption></figure>
    <p id="status" role="status">Loading…</p>
    <p id="help"></p>
    <p id="credits"></p>
    <section id="runs" hidden aria-label="Choose a run">
      <header><h2>Runs &amp; parks</h2><button type="button" id="btn-close-runs" aria-label="Close">✕</button></header>
      <div id="run-list"></div>
    </section>
    <section id="style" hidden aria-label="Rider style"></section>
    <section id="settings" hidden aria-label="Settings"></section>
    <section id="challenges" hidden aria-label="Challenges"></section>
    <section id="results" hidden aria-label="Results"></section>
    <section id="title-screen" aria-label="SkiScrapex"></section>
    <div id="run-card" hidden></div>
    <aside id="coach" hidden aria-live="polite"></aside>
    <div id="ride" hidden>
      <span id="ride-text">Riding</span>
      <button type="button" id="btn-skip">Skip ▸▸</button>
    </div>
    <div id="trick" aria-live="polite"></div>
    <aside id="hint" class="park-cue" hidden aria-label="Terrain park cue">
      <div class="park-cue-heading"><span class="park-cue-context"></span><span class="park-cue-range"></span></div>
      <div class="park-cue-heading"><strong class="park-cue-title"></strong><strong class="park-cue-status"></strong></div>
      <div class="park-cue-gauge" aria-hidden="true"></div>
    </aside>
    <div id="fade"><p id="fade-text"></p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
