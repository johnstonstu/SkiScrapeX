name: Build Apex data

# Downloads LidarBC and OpenStreetMap sources, builds the terrain grid, canopy
# and resort features, then force-pushes the generated files to the orphan
# `data` branch. main never holds generated exports; the site workflow and
# local development fetch them from that branch.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tools/osm/**
      - .github/workflows/data.yml

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GIS packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gdal python3-numpy python3-requests python3-pyproj

      - name: Cache source tiles
        uses: actions/cache@v4
        with:
          path: data/raw
          key: lidarbc-${{ hashFiles('scripts/build-terrain.py') }}
          restore-keys: lidarbc-

      - name: Build terrain and canopy
        run: /usr/bin/python3 scripts/build-terrain.py

      - name: Build horizon from MRDEM
        # Distant terrain only; the game falls back to procedural hills.
        continue-on-error: true
        run: /usr/bin/python3 scripts/build-horizon.py

      - name: Export OpenStreetMap features
        # Tries several Overpass mirrors, then api.openstreetmap.org/api/0.6/map
        # for the terrain bbox. If that still fails, export.py writes the
        # committed ODbL snapshot. The check below refuses a data branch
        # with no buildings or a lift count other than 4.
        run: /usr/bin/python3 tools/osm/export.py --manifest terrain/generated/terrain.json --fallback tools/osm/fallback/features.json

      - name: Assemble data branch
        run: |
          mkdir -p out
          cp terrain/generated/* out/
          /usr/bin/python3 tools/osm/check_features.py tools/osm/generated/features.json
          cp tools/osm/generated/features.json out/
          cat > out/README.md <<EOF
          # SkiScrapex generated data

          Built by the \`Build Apex data\` workflow from main at ${GITHUB_SHA}.
          Do not edit by hand. Elevation and canopy contain information licensed under the
          Open Government Licence – British Columbia. Horizon terrain from NRCan MRDEM, Open Government Licence – Canada. Features © OpenStreetMap contributors (ODbL 1.0).
          EOF
          ls -la out

      - name: Push data branch
        # main publishes to `data`; any other branch to `data-<branch>`, so
        # experiments never replace the data the game is built from.
        working-directory: out
        env:
          TARGET: ${{ github.ref_name == 'main' && 'data' || format('data-{0}', github.ref_name) }}
        run: |
          git init -q -b "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Apex data from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "$TARGET"
