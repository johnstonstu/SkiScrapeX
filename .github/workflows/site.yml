name: Test and deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Build Apex data]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: site
  # Do not cancel: a half-finished deploy leaves duplicate github-pages artifacts
  # and the next deploy-pages step fails with "Found 0" or "Found 2".
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Fetch generated data for the Apex test
        run: |
          mkdir -p game/public/data
          if git fetch --depth 1 origin data; then
            git --work-tree=game/public/data checkout FETCH_HEAD -- .
          fi
          if [ ! -f game/public/data/features.json ]; then
            echo "::error title=Missing features.json::The data branch has no features.json. Run the Build Apex data workflow."
          fi
      - name: Game tests and build
        working-directory: game
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: OSM tool tests
        working-directory: tools/osm
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m unittest discover -s tests
      - name: Smoke check built features.json
        run: python3 tools/osm/check_features.py game/dist/data/features.json

  deploy:
    # Skipped until GitHub Pages is enabled. Set the repo variable PAGES_ENABLED=true to turn it on.
    if: vars.PAGES_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Fetch generated data
        run: |
          mkdir -p game/public/data
          if git fetch --depth 1 origin data; then
            git --work-tree=game/public/data checkout FETCH_HEAD -- .
            ls -la game/public/data
          else
            echo "::warning::No data branch yet. Run the Build Apex data workflow."
          fi
          if [ ! -f game/public/data/features.json ]; then
            echo "::error title=Missing features.json::The data branch has no features.json. Run the Build Apex data workflow."
          fi
      - name: Build
        working-directory: game
        run: |
          npm ci
          npm run build
      - name: Smoke check features.json
        run: python3 tools/osm/check_features.py game/dist/data/features.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist
      # Give the artifact API a moment; deploy-pages@v4 often races and reports 0 artifacts.
      - name: Wait for pages artifact
        run: sleep 20
      - id: pages
        uses: actions/deploy-pages@v4
